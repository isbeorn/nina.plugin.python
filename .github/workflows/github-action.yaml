name: Build and Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

env:
  BUILD_CONFIGURATION: "Release"
  BUILD_OUTPUT: "artifacts/build"
  DOTNET_VERSION: "10.0.x"
  PLUGIN_NAME: "Python Scripting"
  PLUGIN_PROJECT_PATH: "nina.plugin.python.csproj"
  PLUGIN_SLN_PATH: "nina.plugin.python.sln"
  PLUGIN_DLL_NAME: "NINA.Plugin.Python"
  PLUGIN_MANIFEST_PATH: "p/Python Scripting/3.3.0"

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Prepare folders
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ env.BUILD_OUTPUT }}" | Out-Null
          New-Item -ItemType Directory -Force -Path "packages/${{ env.PLUGIN_NAME }}" | Out-Null

      - name: Build .NET Assemblies
        shell: pwsh
        run: |
          dotnet restore "${{ env.PLUGIN_SLN_PATH }}"
          dotnet build "${{ env.PLUGIN_PROJECT_PATH }}" `
            --configuration "${{ env.BUILD_CONFIGURATION }}" `
            --no-restore `
            --output "${{ env.BUILD_OUTPUT }}" `
            -p:NinaPluginDeployEnabled=false `
            -p:Version=${{ github.ref_name }} `
            -p:AssemblyVersion=${{ github.ref_name }} `
            -p:FileVersion=${{ github.ref_name }} `
            -p:InformationalVersion=${{ github.ref_name }}

      - name: Prepare package
        shell: pwsh
        run: |
          $packageDir = "packages/${{ env.PLUGIN_NAME }}"
          $requiredFiles = @(
            "${{ env.PLUGIN_DLL_NAME }}.dll",
            "${{ env.PLUGIN_DLL_NAME }}.pdb"
            "${{ env.PLUGIN_DLL_NAME }}.deps.json",
            "${{ env.PLUGIN_DLL_NAME }}.runtimeconfig.json",
            "ICSharpCode.AvalonEdit.dll",
            "Python.Runtime.dll"
          )

          foreach ($file in $requiredFiles) {
            Copy-Item -Path (Join-Path "${{ env.BUILD_OUTPUT }}" $file) -Destination $packageDir -Force
          }

      - name: Create Plugin archives and manifests
        shell: pwsh
        run: |
          $archiveName = "${{ env.PLUGIN_DLL_NAME }}.${{ github.ref_name }}.zip"
          $installerUrl = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$archiveName"

          Invoke-WebRequest `
            -Uri "https://raw.githubusercontent.com/isbeorn/nina.plugin.manifests/main/tools/CreateManifest.ps1" `
            -OutFile "CreateManifest.ps1"

          ./CreateManifest.ps1 `
            -file "packages/${{ env.PLUGIN_NAME }}/${{ env.PLUGIN_DLL_NAME }}.dll" `
            -installerUrl $installerUrl `
            -createArchive `
            -includeAll `
            -appendVersionToArchive

          Rename-Item `
            -Path "manifest.json" `
            -NewName "${{ env.PLUGIN_DLL_NAME }}.${{ github.ref_name }}.manifest.json" `
            -Force

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ./${{ env.PLUGIN_DLL_NAME }}.${{ github.ref_name }}.zip
            ./${{ env.PLUGIN_DLL_NAME }}.${{ github.ref_name }}.manifest.json

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-manifest
          path: ${{ env.PLUGIN_DLL_NAME }}.${{ github.ref_name }}.manifest.json

  check-repo-exists:
    runs-on: ubuntu-latest
    needs: build-and-release
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Check if repo exists
        id: check
        run: |
          REPO="nina.plugin.manifests"
          OWNER="${{ github.repository_owner }}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://api.github.com/repos/$OWNER/$REPO)
          if [ "$STATUS" -eq 200 ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

  publish-manifest:
    runs-on: ubuntu-latest
    needs: [check-repo-exists, build-and-release]
    if: needs.check-repo-exists.outputs.exists == 'true'
    steps:
      - name: Download manifest artifact
        uses: actions/download-artifact@v4
        with:
          name: plugin-manifest

      - name: Sanitize PLUGIN_NAME
        run: echo "PLUGIN_NAME_SANITIZED=${PLUGIN_NAME//[[:space:]]/}" >> $GITHUB_ENV

      - name: Clone manifest
        run: |
          git clone https://x-access-token:${{ secrets.PAT }}@github.com/${{ github.repository_owner }}/nina.plugin.manifests.git
          cd nina.plugin.manifests
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ env.PLUGIN_NAME_SANITIZED }}/${{ github.ref_name }}"

      - name: Copy manifest file
        run: |
          mkdir -p "./nina.plugin.manifests/manifests/${{ env.PLUGIN_MANIFEST_PATH }}"
          cp "./${{ env.PLUGIN_DLL_NAME }}.${{ github.ref_name }}.manifest.json" "./nina.plugin.manifests/manifests/${{ env.PLUGIN_MANIFEST_PATH }}/manifest.${{ github.ref_name }}.json"
          cd nina.plugin.manifests
          git add .
          git commit -m "Add manifest for release ${{ github.ref_name }}"
          git push origin "${{ env.PLUGIN_NAME_SANITIZED }}/${{ github.ref_name }}"

      - name: Create pull request
        shell: bash
        run: |
          echo "${{ secrets.PAT }}" | gh auth login --with-token
          gh pr create \
            --title "Add manifest for ${{ env.PLUGIN_NAME }} ${{ github.ref_name }}" \
            --body "Automatically generated manifest for release ${{ github.ref_name }}" \
            --head ${{ github.repository_owner }}:${{ env.PLUGIN_NAME_SANITIZED }}/${{ github.ref_name }} \
            --base main \
            --repo isbeorn/nina.plugin.manifests
